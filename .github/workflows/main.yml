name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Required permissions for the workflow
permissions:
  contents: read
  packages: read
  pull-requests: write
  issues: write
  checks: write

# Cancel in-progress runs for the same PR (only cancel on pull requests to avoid interrupting main branch deployments)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static Analysis Jobs
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Pre-existing lint errors

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # Testing Jobs
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [sonarcloud]
    if: ${{ always() && needs.sonarcloud.result != 'cancelled' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: npm test -- --run --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Dummy Firebase config for E2E tests (test mode bypasses auth)
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: test-app-id
          VITE_API_URL: http://localhost:8080
          VITE_MANAGEMENT_API_URL: http://localhost:8081

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build Job
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for production
        run: npm run build
        env:
          # Use dummy values for build validation (PR builds and validation)
          VITE_FIREBASE_API_KEY: 'build-test-key'
          VITE_FIREBASE_AUTH_DOMAIN: 'build-test.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'build-test-project'
          VITE_FIREBASE_STORAGE_BUCKET: 'build-test.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_APP_ID: 'build-test-app'
          VITE_API_URL: 'http://localhost:8080'
          VITE_MANAGEMENT_API_URL: 'http://localhost:8081'

  # Code Quality Analysis
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Temporarily disabled while the hosted SonarCloud scan is hanging and blocking CI.
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-coverage-report
          path: |
            coverage/
            .scannerwork/
          retention-days: 30

  # Security Jobs (PR only)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  owasp-pr-scan:
    name: OWASP PR Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Build PR app for scan
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: 'build-test-key'
          VITE_FIREBASE_AUTH_DOMAIN: 'build-test.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'build-test-project'
          VITE_FIREBASE_STORAGE_BUCKET: 'build-test.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_APP_ID: 'build-test-app'
          VITE_API_URL: 'http://localhost:8080'
          VITE_MANAGEMENT_API_URL: 'http://localhost:8081'

      - name: OWASP ZAP Baseline Scan
        id: zap-scan
        run: |
          echo "Running OWASP ZAP baseline scan..."
          test -f .zap/rules.tsv || { echo "::error::.zap/rules.tsv not found"; exit 1; }
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Timed out waiting for local preview server"
              cat /tmp/vite-preview.log || true
              exit 1
            fi
            sleep 1
          done
          docker pull ghcr.io/zaproxy/zaproxy:stable

          touch zap_report.html zap_report.json zap_report.md
          chmod 666 zap_report.html zap_report.json zap_report.md

          set +e
          docker run -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network=host \
            -w /zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:4173/ \
            -r zap_report.html \
            -J zap_report.json \
            -w zap_report.md \
            -a \
            -c /zap/wrk/.zap/rules.tsv
          zap_exit=$?
          set -e

          case "$zap_exit" in
            0)
              echo "ZAP completed with no threshold-triggering findings."
              ;;
            1)
              echo "::notice::ZAP returned exit code 1 (warnings). Continuing because PR gate is enforced by parsed High findings."
              ;;
            2)
              echo "::notice::ZAP returned exit code 2 (fail-threshold findings). Deferring failure until after summary and artifact upload."
              ;;
            *)
              echo "::error::OWASP ZAP scan failed with exit code $zap_exit"
              exit "$zap_exit"
              ;;
          esac
          echo "zap_exit=$zap_exit" >> "$GITHUB_OUTPUT"

      - name: Summarize OWASP findings
        id: zap-summary
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          report_path = "zap_report.json"
          if not os.path.exists(report_path):
              print("::error::ZAP report not found")
              sys.exit(1)

          with open(report_path, "r", encoding="utf-8") as f:
              report = json.load(f)

          risk_counts = {"3": 0, "2": 0, "1": 0, "0": 0}
          instance_total = 0

          for site in report.get("site", []):
              for alert in site.get("alerts", []):
                  risk = str(alert.get("riskcode", "0"))
                  instances = alert.get("instances") or []
                  risk_counts[risk] = risk_counts.get(risk, 0) + 1
                  instance_total += len(instances)

          high = risk_counts.get("3", 0)
          medium = risk_counts.get("2", 0)
          low = risk_counts.get("1", 0)
          info = risk_counts.get("0", 0)
          total = high + medium + low + info

          summary = (
              "## 🔒 OWASP ZAP Summary (Brief)\n\n"
              "**Target:** PR preview build (http://127.0.0.1:4173/)\n\n"
              f"- High: {high}\n"
              f"- Medium: {medium}\n"
              f"- Low: {low}\n"
              f"- Informational: {info}\n"
              f"- Total alerts: {total}\n"
              f"- Total affected instances: {instance_total}\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"high={high}\n")
              f.write(f"medium={medium}\n")
              f.write(f"low={low}\n")
              f.write(f"info={info}\n")
              f.write(f"total={total}\n")
              f.write(f"instances={instance_total}\n")
          PY

      - name: Comment OWASP summary on PR
        if: ${{ always() && steps.zap-summary.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          ZAP_HIGH: ${{ steps.zap-summary.outputs.high }}
          ZAP_MEDIUM: ${{ steps.zap-summary.outputs.medium }}
          ZAP_LOW: ${{ steps.zap-summary.outputs.low }}
          ZAP_INFO: ${{ steps.zap-summary.outputs.info }}
          ZAP_TOTAL: ${{ steps.zap-summary.outputs.total }}
          ZAP_INSTANCES: ${{ steps.zap-summary.outputs.instances }}
        with:
          script: |
            const marker = '<!-- owasp-zap-pr-summary -->';
            const body = `${marker}
            ## 🔒 OWASP ZAP Summary (Brief)
            
            - High: ${process.env.ZAP_HIGH}
            - Medium: ${process.env.ZAP_MEDIUM}
            - Low: ${process.env.ZAP_LOW}
            - Informational: ${process.env.ZAP_INFO}
            - Total alerts: ${process.env.ZAP_TOTAL}
            - Total affected instances: ${process.env.ZAP_INSTANCES}
            
            Full reports are available in the workflow artifacts.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload ZAP Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-pr-scan-report
          path: |
            zap_report.html
            zap_report.json
            zap_report.md
          retention-days: 14

      - name: Fail when OWASP summary cannot be generated
        if: ${{ always() && steps.zap-summary.outcome != 'success' }}
        run: |
          echo "::error::Failed to parse OWASP ZAP report."
          exit 1

      - name: Fail on ZAP fail-threshold findings
        if: ${{ steps.zap-summary.outcome == 'success' && steps.zap-scan.outputs.zap_exit == '2' }}
        run: |
          echo "::error::OWASP ZAP reported fail-threshold findings (exit code 2)."
          exit 1

      - name: Fail on high findings
        if: ${{ steps.zap-summary.outcome == 'success' && steps.zap-summary.outputs.high != '0' }}
        run: |
          echo "::error::OWASP ZAP found high-severity findings."
          exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate

  # Deployment Job (main branch only)
  deploy:
    name: Deploy to Firebase Dev
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, e2e-tests]
    # Use explicit needs result checks so skipped optional jobs elsewhere in the workflow
    # do not prevent main-branch deploys from running.
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.lint.result == 'success' &&
        needs.type-check.result == 'success' &&
        needs.unit-tests.result == 'success' &&
        needs.e2e-tests.result == 'success'
      }}
    environment: 
      name: dev
      url: 'https://recipe-mgmt-dev.web.app/'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required secrets
        run: |
          trim_url() {
            local url="${1:-}"
            while [ "${url%/}" != "$url" ]; do url="${url%/}"; done
            printf '%s' "$url"
          }

          if [ -z "$VITE_MANAGEMENT_API_URL" ]; then
            echo "::error::VITE_MANAGEMENT_API_URL secret is not set. Aborting deploy to prevent a miswired bundle."
            exit 1
          fi

          AI_API_URL="${VITE_AI_API_URL:-$VITE_API_URL}"

          if [ -z "$AI_API_URL" ]; then
            echo "::error::Set VITE_AI_API_URL (preferred) or VITE_API_URL for AI features before deploying."
            exit 1
          fi

          if [ "$(trim_url "$AI_API_URL")" = "$(trim_url "$VITE_MANAGEMENT_API_URL")" ]; then
            echo "::error::AI and management API URLs point to the same service. Check VITE_AI_API_URL/VITE_API_URL and VITE_MANAGEMENT_API_URL secrets."
            exit 1
          fi
        env:
          VITE_AI_API_URL: ${{ secrets.VITE_AI_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MANAGEMENT_API_URL: ${{ secrets.VITE_MANAGEMENT_API_URL }}

      - name: Build for production with environment secrets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AI_API_URL: ${{ secrets.VITE_AI_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MANAGEMENT_API_URL: ${{ secrets.VITE_MANAGEMENT_API_URL }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_DEV }}
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Storage Rules to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          FIREBASE_PROJECT_ID_DEV: ${{ secrets.FIREBASE_PROJECT_ID_DEV || 'recipe-mgmt-dev' }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > firebase-service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
            set +e
            deploy_output="$(npx firebase-tools deploy --only storage --project "$FIREBASE_PROJECT_ID_DEV" --non-interactive 2>&1)"
            deploy_status=$?
            set -e
            printf '%s\n' "$deploy_output"
            rm firebase-service-account.json

            if [ $deploy_status -ne 0 ]; then
              if printf '%s' "$deploy_output" | grep -qiE "Permission.*firebasestorage|defaultBucket|Firebase Storage has not been set up"; then
                echo "::warning::Skipping storage rules deployment: Firebase Storage may be uninitialized (visit https://console.firebase.google.com/project/$FIREBASE_PROJECT_ID_DEV/storage) or the service account lacks required Storage permissions (e.g., roles/firebasestorage.admin). Hosting deploy already succeeded."
              else
                exit $deploy_status
              fi
            fi
          fi

  # Post-deployment testing (main branch only, after deploy)
  post-deploy-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy.result == 'success'
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30 seconds for deployment to propagate..."
          sleep 30

      - name: Test homepage accessibility
        run: |
          echo "Testing homepage..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://recipe-mgmt-dev.web.app/)
          if [ "$response" -ne 200 ]; then
            echo "❌ Homepage returned status code: $response"
            exit 1
          fi
          echo "✅ Homepage is accessible (HTTP $response)"

      - name: Test static assets
        run: |
          echo "Testing static assets..."
          # Check if main JS bundle loads
          homepage=$(curl -s https://recipe-mgmt-dev.web.app/)
          if echo "$homepage" | grep -q "src=\"/assets/index-"; then
            echo "✅ Main JS bundle reference found"
          else
            echo "❌ Main JS bundle not found in homepage"
            exit 1
          fi
          
          # Check if CSS loads
          if echo "$homepage" | grep -q "rel=\"stylesheet\""; then
            echo "✅ Stylesheet reference found"
          else
            echo "❌ Stylesheet not found in homepage"
            exit 1
          fi

      - name: Test API endpoints health
        run: |
          echo "Testing API health..."
          # Test AI service health (if available)
          if [ -n "${{ secrets.VITE_AI_API_URL }}" ] || [ -n "${{ secrets.VITE_API_URL }}" ]; then
            api_url="${{ secrets.VITE_AI_API_URL }}"
            if [ -z "$api_url" ]; then
              api_url="${{ secrets.VITE_API_URL }}"
            fi
            echo "Checking AI service at: $api_url"
            
            # Try health endpoint
            response=$(curl -s -o /dev/null -w "%{http_code}" "$api_url/actuator/health" || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ AI service health check passed"
            else
              echo "⚠️  AI service health check returned: $response (may be expected if service is down)"
            fi
          else
            echo "ℹ️  No AI API URL configured, skipping API health check"
          fi

      - name: Test Firebase configuration
        run: |
          echo "Validating Firebase configuration in deployed app..."
          homepage=$(curl -s https://recipe-mgmt-dev.web.app/)
          
          # Check if Firebase is initialized (look for Firebase SDK)
          if echo "$homepage" | grep -q "firebase"; then
            echo "✅ Firebase SDK detected"
          else
            echo "⚠️  Firebase SDK not detected in initial HTML"
          fi

      - name: Performance check
        run: |
          echo "Checking page load performance..."
          start_time=$(date +%s%N)
          curl -s -o /dev/null https://recipe-mgmt-dev.web.app/
          end_time=$(date +%s%N)
          
          duration=$(( (end_time - start_time) / 1000000 ))
          echo "Homepage load time: ${duration}ms"
          
          if [ "$duration" -gt 5000 ]; then
            echo "⚠️  Homepage took longer than 5s to load"
          else
            echo "✅ Homepage load time is acceptable"
          fi

      - name: Test security headers
        run: |
          echo "Checking security headers..."
          headers=$(curl -s -I https://recipe-mgmt-dev.web.app/)
          
          # Check for important security headers
          if echo "$headers" | grep -iq "x-frame-options\|content-security-policy"; then
            echo "✅ Security headers present"
          else
            echo "ℹ️  Consider adding security headers (X-Frame-Options, CSP)"
          fi
          
          # Check for HTTPS
          if echo "$headers" | grep -q "HTTP/2 200"; then
            echo "✅ Using HTTP/2"
          elif echo "$headers" | grep -q "HTTP/1.1 200"; then
            echo "✅ HTTPS connection established"
          fi

      - name: Post-deployment summary
        if: always()
        run: |
          echo "## 🚀 Post-Deployment Test Summary"
          echo ""
          echo "**Environment:** Dev"
          echo "**URL:** https://recipe-mgmt-dev.web.app/"
          echo "**Commit:** ${{ github.sha }}"
          echo ""
          echo "✅ Functional smoke tests completed"
          echo ""
          echo "Check individual steps for details."

  # Dynamic multi-user post-deployment tests (main branch only, after deploy)
  # Requires FIREBASE_ADMIN_SERVICE_ACCOUNT, FIREBASE_WEB_API_KEY,
  # VITE_MANAGEMENT_API_URL to be configured as secrets.
  # Gracefully skipped when secrets are absent.
  multi-user-post-deploy-tests:
    name: Multi-User Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy.result == 'success'
      }}
    env:
      FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
      MANAGEMENT_API_URL: ${{ secrets.VITE_MANAGEMENT_API_URL || 'https://recipe-management-service-341866919859.europe-west2.run.app' }}
      DEPLOYED_APP_URL: https://recipe-mgmt-dev.web.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theandiman'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_READER }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30 seconds for deployment to propagate..."
          sleep 30

      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -z "$FIREBASE_ADMIN_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_WEB_API_KEY" ] || [ -z "$MANAGEMENT_API_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping multi-user post-deploy tests: one or more required secrets (FIREBASE_ADMIN_SERVICE_ACCOUNT, FIREBASE_WEB_API_KEY, VITE_MANAGEMENT_API_URL) are not configured."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run multi-user post-deployment tests
        if: steps.check-secrets.outputs.skip == 'false'
        run: npm run test:post-deploy
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-secrets.outputs.skip == 'false'
        with:
          name: multi-user-post-deploy-playwright-report
          path: playwright-report/
          retention-days: 14

  # OWASP Security Scan (main branch only, after deploy, parallel to post-deploy-tests)
  owasp-security-scan:
    name: OWASP Security Scan
    runs-on: ubuntu-latest
    needs: [deploy]
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy.result == 'success'
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30 seconds for deployment to propagate..."
          sleep 30

      - name: OWASP ZAP Baseline Scan
        run: |
          echo "Running OWASP ZAP baseline scan..."
          docker pull ghcr.io/zaproxy/zaproxy:stable
          
          # Create report files with proper permissions
          touch zap_report.html zap_report.json zap_report.md
          chmod 666 zap_report.html zap_report.json zap_report.md
          
          # Run ZAP baseline scan
          docker run -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://recipe-mgmt-dev.web.app/ \
            -r zap_report.html \
            -J zap_report.json \
            -w zap_report.md \
            -a \
            -c .zap/rules.tsv || true
          
          echo "✅ ZAP scan completed"

      - name: Upload ZAP Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            zap_report.html
            zap_report.json
            zap_report.md
          retention-days: 30

  # Nuclei DAST Security Scan (main branch only, after deploy, parallel to OWASP ZAP)
  nuclei-dast-scan:
    name: Nuclei DAST Security Scan
    runs-on: ubuntu-latest
    needs: [deploy]
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy.result == 'success'
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30 seconds for deployment to propagate..."
          sleep 30

      - name: Run Nuclei DAST Scan
        uses: projectdiscovery/nuclei-action@v3.1.1
        with:
          target: "https://recipe-mgmt-dev.web.app/"
          flags: "-severity critical,high,medium -tags misconfig,exposure,cve,owasp-top10"

      - name: OWASP scan summary
        if: always()
        run: |
          echo "## 🔒 OWASP ZAP Security Scan Summary"
          echo ""
          echo "**Target:** https://recipe-mgmt-dev.web.app/"
          echo "**Scan Type:** Baseline"
          echo "**Commit:** ${{ github.sha }}"
          echo ""
          echo "✅ Security scan completed"
          echo "📊 Reports available in artifacts (zap-scan-report)"
          echo ""
          echo "Check the ZAP scan report artifact for detailed findings."

  # Summary Job - provides clear status
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
    needs: [lint, type-check, unit-tests, e2e-tests, build, security-scan, owasp-pr-scan, dependency-review]
    steps:
      - name: Check job statuses
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = [
              { name: 'Lint', status: '${{ needs.lint.result }}' },
              { name: 'Type Check', status: '${{ needs.type-check.result }}' },
              { name: 'Unit Tests', status: '${{ needs.unit-tests.result }}' },
              { name: 'E2E Tests', status: '${{ needs.e2e-tests.result }}' },
              { name: 'Build', status: '${{ needs.build.result }}' },
              { name: 'Security Scan', status: '${{ needs.security-scan.result }}' },
              { name: 'OWASP PR Scan', status: '${{ needs.owasp-pr-scan.result }}' },
              { name: 'Dependency Review', status: '${{ needs.dependency-review.result }}' }
            ];
            
            const failed = jobs.filter(j => j.status === 'failure');
            const passed = jobs.filter(j => j.status === 'success');
            const skipped = jobs.filter(j => j.status === 'skipped');
            
            let comment = '## 🔍 PR Validation Results\n\n';
            
            if (failed.length === 0) {
              comment += '### ✅ All checks passed!\n\n';
            } else {
              comment += '### ❌ Some checks failed\n\n';
              comment += '**Failed:**\n';
              failed.forEach(j => comment += `- ❌ ${j.name}\n`);
              comment += '\n';
            }
            
            if (passed.length > 0) {
              comment += '**Passed:**\n';
              passed.forEach(j => comment += `- ✅ ${j.name}\n`);
              comment += '\n';
            }
            
            comment += `\n[View detailed results](${context.payload.pull_request.html_url}/checks)`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('PR Validation Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
            
            // Fail the job if any required checks failed
            if (failed.length > 0) {
              core.setFailed(`${failed.length} check(s) failed`);
            }
