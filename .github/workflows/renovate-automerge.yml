name: Renovate Automerge

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    name: Auto-approve Renovate PRs
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]'
    steps:
      - name: Check update type
        id: check-type
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const isMajor = /Update type:\s*major/i.test(body) || labels.includes('type: major');
            if (isMajor) {
              core.setOutput('should-automerge', 'false');
              console.log('Major update detected — skipping auto-approve.');
            } else {
              core.setOutput('should-automerge', 'true');
              console.log('Non-major update detected — proceeding with auto-approve.');
            }

      - name: Disable automerge and dismiss approvals for major updates
        if: steps.check-type.outputs.should-automerge == 'false'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Disable automerge if it was previously enabled
            try {
              await github.graphql(`
                mutation DisableAutoMerge($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, { pullRequestId: pr.node_id });
              console.log('Auto-merge disabled on PR #' + pr.number);
            } catch (error) {
              console.log('Auto-merge disable skipped (may not have been enabled):', error.message);
            }

            // Dismiss any bot approvals on the PR
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              const approvals = reviews.filter(r => r.state === 'APPROVED');
              await Promise.allSettled(approvals.map(review =>
                github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  review_id: review.id,
                  message: 'Dismissed: major update detected — manual review required.',
                }).then(() => {
                  console.log('Dismissed approval review #' + review.id);
                }).catch((error) => {
                  console.log('Failed to dismiss review #' + review.id + ':', error.message);
                })
              ));
            } catch (error) {
              console.log('Review dismissal skipped:', error.message);
            }

      - name: Auto-approve PR
        if: steps.check-type.outputs.should-automerge == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable automerge
        if: steps.check-type.outputs.should-automerge == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.updateBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            }).catch((error) => { console.log('Branch update skipped:', error.message); });

            try {
              await github.graphql(`
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, {
                pullRequestId: context.payload.pull_request.node_id,
              });
              console.log('Auto-merge enabled on PR #' + context.payload.pull_request.number);
            } catch (error) {
              console.log('Auto-merge enable skipped:', error.message);
            }

