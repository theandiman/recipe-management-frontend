name: Renovate Automerge

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    name: Auto-approve Renovate PRs
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]'
    steps:
      - name: Check update type labels
        id: check-labels
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const isMajor = /Update type:\s*major/i.test(body);
            if (isMajor) {
              core.setOutput('should-automerge', 'false');
              console.log('Major update detected from PR body — skipping auto-approve.');
            } else {
              core.setOutput('should-automerge', 'true');
              console.log('Non-major update detected — proceeding with auto-approve.');
            }

      - name: Auto-approve PR
        if: steps.check-labels.outputs.should-automerge == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable automerge
        if: steps.check-labels.outputs.should-automerge == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.updateBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            }).catch((error) => { console.log('Branch update skipped:', error.message); });

            try {
              await github.graphql(`
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, {
                pullRequestId: context.payload.pull_request.node_id,
              });
              console.log('Auto-merge enabled on PR #' + context.payload.pull_request.number);
            } catch (error) {
              console.log('Auto-merge enable skipped:', error.message);
            }
